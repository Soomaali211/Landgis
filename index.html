:flex;align-items:center;gap:8px}\n.card h2 .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:11px;letter-spacing:0}\nlabel{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}\ninput[type=number],select{width:100%;font:inherit;font-family:var(--font-mono);font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-width:0}\nselect{font-family:var(--font-sans)}\ninput:focus-visible,select:focus-visible,button:focus-visible,.drop:focus-visible{outline:2px solid var(--accent);outline-offset:1px}\n.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.fields .full{grid-column:1/-1}\n.drop{display:block;border:1.5px dashed var(--line);border-radius:5px;padding:10px 12px;cursor:pointer;background:var(--bg);margin-bottom:8px}\n.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}\n.drop b{display:block;font-weight:500;color:var(--fg);font-size:13px}\n.drop span{font-size:12px;color:var(--muted)}\n.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}\n.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\nbutton{font:inherit;font-size:13px;font-weight:500;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;cursor:pointer}\nbutton:hover{border-color:var(--accent)}\nbutton.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}\nbutton:disabled{opacity:.5;cursor:not-allowed}\n.check{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--fg);margin:0}\n.check input{accent-color:var(--accent)}\n.hint{font-size:12px;color:var(--muted);margin:6px 0 0}\n.msg{font-size:12.5px;padding:8px 10px;border-radius:4px;background:var(--warn-soft);color:var(--warn);margin-top:8px}\n.msg.ok{background:var(--accent-soft);color:var(--accent)}\n.msg[hidden]{display:none} ard\" data-s=\"files\" aria-labelledby=\"h1\">\n        <h2 id=\"h1\"><span class=\"n\">1</span>Faylasha</h2>\n        <label class=\"drop\" id=\"dropB\" tabindex=\"0\"><b>Xuduudka beerta</b><span id=\"nameB\">GeoJSON (.geojson / .json) — xariiq ama polygon</span><input type=\"file\" id=\"fileB\" accept=\".geojson,.json,application/json,application/geo+json\"></label>\n        <label class=\"drop\" id=\"dropS\" tabindex=\"0\"><b>Block tusaale ah (ikhtiyaari)</b><span id=\"nameS\">Isla file-ka xuduudka ayaa laga qaadan karaa</span><input type=\"file\" id=\"fileS\" accept=\".geojson,.json,application/json,application/geo+json\"></label>\n        <label class=\"drop\" id=\"dropA\" tabindex=\"0\"><b>Aag gaar ah (ikhtiyaari)</b><span id=\"nameA\">GeoJSON polygon — plots iyo half-plots ku jira ayaa la tirinayaa</span><input type=\"file\" id=\"fileA\" accept=\".geojson,.json,application/json,application/geo+json\"></label>\n        <div class=\"fields\">\n          <div class=\"full\"><label for=\"selB\">Xuduudka</label><select id=\"selB\"></select></div>\n          <div class=\"full\"><label for=\"selS\">Block-ka tusaalaha (jihada iyo meesha shabakadda)</label><select id=\"selS\"></select></div>\n        </div>\n        <div class=\"row\" style=\"margin-top:10px\"><button id=\"btnSample\" type=\"button\">Isticmaal xogta tusaalaha</button></div>\n        <div class=\"msg\" id=\"msgFiles\" hidden></div>\n      </section>\n\n      <section class=\"card\" data-s=\"sizes\" aria-labelledby=\"h2\">\n        <h2 id=\"h2\"><span class=\"n\">2</span>Cabbirrada (mitir)</h2>\n        <div class=\"fields\">\n          <div><label for=\"bL\">Block: dherer</label><input type=\"number\" id=\"bL\" value=\"90\" min=\"1\" step=\"0.1\"></div>\n          <div><label for=\"bW\">Block: ballac</label><input type=\"number\" id=\"bW\" value=\"48\" min=\"1\" step=\"0.1\"></div>\n          <div><label for=\"pW\">Plot: ballac</label><input type=\"number\" id=\"pW\" value=\"18\" min=\"1\" step=\"0.1\" f.name+'” GeoJSON sax ah ma aha.')}}\n  const rk=l=>l.bnd?0:isBlk(l)?1:2;L.sort((a,b)=>rk(a)-rk(b));VIEW=null;\n  AL=Math.max(0,L.findIndex(l=>!l.bnd&&/plot/i.test(l.name)));if(L[AL]&&L[AL].bnd)AL=Math.max(0,L.findIndex(l=>!l.bnd));render()}\nfunction split(name,fe){let key=null;const ks=[...new Set(fe.flatMap(f=>Object.keys(f.properties||{})))];\n  for(const k of ks){const u=[...new Set(fe.map(f=>f.properties[k]))];if(u.length>=2&&u.length<=8&&u.filter(v=>/block|plot|half|bound|xuduud/i.test(v)).length>=2){key=k;break}}\n  const g={};fe.forEach(f=>{const k=key?String(f.properties[key]):name;(g[k]=g[k]||[]).push(f)});Object.entries(g).forEach(([n,fs])=>mk(n,fs))}\nfunction mk(name,feats){const P=feats.map(f=>f.properties||{}),ks=[...new Set(P.flatMap(Object.keys))];\n  const ok=ks.find(k=>/owner|milk|calaam|mark/i.test(k)),hk=ks.find(k=>/heer|grade|level/i.test(k));\n  const lk=/block/i.test(name)?ks.find(k=>{const v=P.map(p=>p[k]).filter(x=>!blank(x));return v.length&&new Set(v).size>=.9*feats.length&&!/^(fid|id|gid|objectid)$/i.test(k)&&String(v[0]).length<12}):null;\n  const l={name,feats,on:true,bnd:BH.test(name),del:{},ann:{},hk:{},sel:new Set(),nm:false,idl:!!lk,lk};\n  feats.forEach((f,i)=>{f._i=i;const o=ok&&f.properties[ok],h=hk&&f.properties[hk];if(!blank(o))l.ann[i]=owner(String(o).trim());if(!blank(h))l.hk[i]=heer(String(h).trim()).n});L.push(l)}\n\n/* ===== 2. GEOMETRY (mitir) ===== */\nfunction eachPt(g,fn){const r=c=>typeof c[0]==='number'?fn(c):c.forEach(r);if(g&&g.coordinates)r(g.coordinates)}\nfunction setProj(){const xs=[],ys=[];L.forEach(l=>l.feats.forEach(f=>eachPt(f.geometry,p=>{xs.push(p[0]);ys.push(p[1])})));\n  const mx=(Math.min(...xs)+Math.max(...xs))/2,my=(Math.min(...ys)+Math.max(...ys))/2,geo=xs.every(x=>Math.abs(x)<=180)&&ys.every(y=>Math.abs(y)<=90);\n  O=[mx,my];K=geo?[111320*Math.cos(my*Math.PI/180),110574]:[1,1]}\nconst pr=p=>[(p[0]-O[0])*K[0],-(p[1]-O[1])*K[1]];\nfunction rings(g){const t=g.type;return t==='Polygon'?[g.coordinates.map(r=>r.map(pr))]:t==='MultiPolygon'?g.coordinates.map(p=>p.map(r=>r.map(pr))):[]}\nconst ra=r=>Math.abs(r.reduce((s,p,i)=>{const q=r[(i+1)%r.length];return s+p[0]*q[1]-q[0]*p[1]},0))/2;\nconst area=g=>rings(g).reduce((s,p)=>s+ra(p[0])-p.slice(1).reduce((a,h)=>a+ra(h),0),0);\nfunction pir(pt,r){let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++)if((r[i][1]>pt[1])!==(r[j][1]>pt[1])&&pt[0]<(r[j][0]-r[i][0])*(pt[1]-r[i][1])/(r[j][1]-r[i][1])+r[i][0])c=!c;return c}\nfunction cen(g){let n=0,x=0,y=0;eachPt(g,p=>{const q=pr(p);x+=q[0];y+=q[1];n++});return[x/n,y/n]}\nconst inB=(p,B)=>B.some(b=>pir(p,b[0])&&!b.slice(1).some(h=>pir(p,h)));\nconst segX=(a,b,c,d)=>{const o=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);return o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0};\n/* 'f' = 100% gudaha, 'p' = qayb ahaan, 'o' = dibadda */\nfunction status(f,B){const R=rings(f.geometry);if(!R.length)return inB(cen(f.geometry),B)?'f':'o';\n  const pts=R.flatMap(p=>p[0]),all=pts.every(p=>inB(p,B));\n  const cross=R.some(p=>p.some(r=>r.some((u,i)=>{const v=r[(i+1)%r.length];return B.some(b=>b.some(br=>br.some((s,j)=>segX(u,v,s,br[(j+1)%br.length]))))})));\n  if(all&&!cross)return'f';\n  return(pts.some(p=>inB(p,B))||cross||B.some(b=>b[0].some(p=>R.some(r=>pir(p,r[0])))))?'p':'o'}\nconst bndLayer=()=>L.find(l=>l.bnd&&l.on);\nfunction classify(){const bl=bndLayer(),mode=$('#md').value,k=L.map(l=>l.name+l.bnd+l.on+l.feats.length).join()+mode;if(k===ckey)return;ckey=k;\n  const B=bl?bl.feats.flatMap(f=>rings(f.geometry)):null;\n  L.forEach(l=>l.feats.forEach(f=>{f._s=!B||l.bnd?'f':mode==='c'?(inB(cen(f.geometry),B)?'f':'o'):status(f,B)}))}\n\n/* ===== 3. STATISTICS ===== */\nfunction stats(){classify();const hasB=!!bndLayer(),mode=$('#md').value;\n  return L.filter(l=>l.on&&!l.bnd).map(l=>{\n    const inn=l.feats.filter(f=>!l.del[f._i]&&(f._s==='f'||(mode==='i'&&f._s==='p'))),mf=inn.filter(f=>l.ann[f._i]),uf=inn.filter(f=>!l.ann[f._i]);\n    const own={},hkc={};mf.forEach(f=>{const n=l.ann[f._i].n;own[n]=(own[n]||0)+1});\n    uf.forEach(f=>{const h=l.hk[f._i]||'';hkc[h]=(hkc[h]||0)+1});\n    const ar=inn.map(f=>f._a=f._a||area(f.geometry)).filter(a=>a>0);\n    return{l,tot:inn.length,mk:mf.length,own,hkc,part:hasB&&mode==='f'?l.feats.filter(f=>f._s==='p'&&!l.del[f._i]).length:null,out:hasB?l.feats.filter(f=>f._s==='o'&&!l.del[f._i]).length:null,\n      ar:ar.length?{avg:ar.reduce((a,b)=>a+b)/ar.length,min:Math.min(...ar),max:Math.max(...ar)}:null,kind:/Point/.test(l.feats[0].geometry.type)?'p':/Line/.test(l.feats[0].geometry.type)?'l':'a'}})}\nconst fa=m=>m>=1e4?(m/1e4).toFixed(2)+' ha':m>=100?Math.round(m)+' m²':m.toFixed(1)+' m²';\nfunction sumHtml(S){if(!S.length)return'';const nm=[...new Set(S.flatMap(s=>Object.keys(s.own)))];\n  const h=HK.filter(x=>S.some(s=>s.hkc[x.n])),hn=S.some(s=>s.hkc['']);\n  const row=(a,v,t)=>`<tr><${t||'td'}>${a}</${t||'td'}>${v.map(x=>`<${t||'td'}>${x}</${t||'td'}>`).join('')}<${t||'td'}>${v.reduce((p,q)=>p+(+q||0),0)}</${t||'td'}></tr>`;\n  const dot=c=>`<span class=\"dot\" style=\"display:inline-block;background:${c};vertical-align:middle\"></span> `;\n  let o='<table>'+row('',S.map(s=>esc(s.l.name)),'th').replace(/<th>(\\d+)<\\/th><\\/tr>$/,'<th>Σ</th></tr>');\n  nm.forEach(n=>o+=row(dot(owner(n).c)+esc(n),S.map(s=>s.own[n]||0)));\n  o+=row('<b>Calaamadsan</b>',S.map(s=>s.mk))+row('Aan calaamadsanayn',S.map(s=>s.tot-s.mk))+row('<b>Wadar (100% gudaha)</b>',S.map(s=>s.tot));\n  if(S.some(s=>s.part))o+=row('Qayb gudaha (lama tirin)',S.map(s=>s.part||0));if(S.some(s=>s.out))o+=row('Dibadda xuduudka',S.map(s=>s.out||0));\n  h.forEach(x=>o+=row('<small>Heer · </small>'+dot(x.c)+esc(x.n),S.map(s=>s.hkc[x.n]||0)));if(hn)o+=row('<small>Heer la’aan</small>',S.map(s=>s.hkc['']||0));\n  return o+'</table><small>Heerarku waxay tirinayaan kuwa aan calaamadsanayn oo keliya.</small>'}\n\n/* ===== 4. SVG HELPERS + LEGEND ===== */\nlet notes=[],rec=[];\nfunction tw(t,sz,b){cv.font=(b?'bold ':'')+'100px Arial';return cv.measureText(t).width/100*sz*.3528}\nfunction T(t,x,y,w,h,sz,o={}){t=String(t);let s=sz;const W=tw(t,s,o.b);\n  if(W>w){s=sz*w/W*.97;if(s<5.2){s=5.2;while(t.length>2&&tw(t+'…',s,o.b)>w)t=t.slice(0,-1);t+='…';notes.push('Qoraalka “'+t+'” waa la gooyay.')}}\n  rec.push([x,y,w,h,t]);const a=o.a||'l',ax=a==='c'?x+w/2:a==='r'?x+w:x;\n  return`<text x=\"${ax}\" y=\"${y+h/2}\" font-size=\"${s*.3528}\" font-family=\"Arial,sans-serif\" ${o.b?'font-weight=\"bold\"':''} fill=\"${o.c||'#1E293B'}\" text-anchor=\"${a==='c'?'middle':a==='r'?'end':'start'}\" dominant-baseline=\"central\">${esc(t)}</text>`}\nconst R=(x,y,w,h,f,s,sw,d,r)=>`<rect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" rx=\"${r||0}\" fill=\"${f||'none'}\" stroke=\"${s||'none'}\" stroke-width=\"${sw||.2}\" ${d?'stroke-dasharray=\"1.6 1\"':''}/>`;\nconst sty=l=>l.bnd?{fill:'#EEF1F3',stroke:'#E31A1C',w:.5,d:1}:/half/i.test(l.name)?{fill:null,stroke:'#0A6A6A',w:.25}:isBlk(l)?{fill:null,stroke:'#1F3A5F',w:.55}:{fill:null,stroke:'#4D636D',w:.15};\nfunction table(o,g,y,p,title,rows,cols){const P=3.9,X=g.PX+P,W=g.PW-2*P;\n  o.s+=T(title.toUpperCase(),X,y,W,3.2,6.5,{b:1,c:'#64748B'})+R(X,y+3.4,W,.2,'#CBD5E1');y+=4.6;\n  const cx=i=>X+W-9*(cols.length+1-i);cols.forEach((c,i)=>o.s+=T(c,cx(i),y-.4,9,3,6,{a:'r',c:'#64748B',b:1}));o.s+=T('Σ',cx(cols.length),y-.4,9,3,6,{a:'r',c:'#64748B',b:1});\n  rows.forEach(([lab,col,stroke,v])=>{o.s+=(stroke?R(X,y+p/2-1.75,5.6,3.5,'none',col,.5):R(X,y+p/2-1.75,5.6,3.5,col,'#475569',.2))+T(lab,X+7.6,y,W-7.6-9*(cols.length+1),p,8);\n    v.forEach((n,i)=>o.s+=T(n,cx(i),y,9,p,8,{a:'r'}));o.s+=T(v.reduce((a,b)=>a+b,0),cx(cols.length),y,9,p,8,{a:'r',b:1})+R(X,y+p-.1,W,.15,'#E2E8F0');y+=p});return y+1.2}\nfunction legend(S,g,title){rec=[];notes=[];const{PX,PY,PW,PH}=g,P=3.9,W=PW-2*P,X=PX+P,o={s:''};let y=PY+3;\n  o.s+=R(PX,PY,PW,PH,'#F8FAFC','#CBD5E1',.3,0,2);\n  if(title){o.s+=R(PX,PY,PW,10,'#1F3A5F',0,0,0,2)+R(PX,PY+5,PW,5,'#1F3A5F')+T(title,X+.7,PY+1,W,8,14,{b:1,c:'#fff'});y=PY+12.6}\n  o.s+=T('
