name: Build APK
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch proj4 (offline copy)
        run: bash scripts/fetch-libs.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/LandGIS-BlocksPlots.apk
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: LandGIS-APK
          path: dist/LandGIS-BlocksPlots.apk
      - name: Attach APK to the GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LandGIS-BlocksPlots.apk
